services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: quotmate
      MYSQL_DATABASE: quotmate
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pquotmate"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://root:quotmate@mysql:3306/quotmate
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      DEBUG: "true"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
